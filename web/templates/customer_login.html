<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 시스템 접속</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }

    </style>
</head>

<body>
    <div class="card shadow-sm mt-4">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">환영합니다! 👋</h3>
            <form action="/" method="POST" id="customerLoginForm" novalidate>
                <div class="mb-3">
                    <label class="form-label text-muted">테이블 번호</label>
                    <input type="text" name="table_no" id="tableNo" class="form-control form-control-lg"
                        inputmode="numeric" maxlength="10" autocomplete="off" required aria-describedby="tableNoHelp">
                    <div id="tableNoHelp" class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">주문자 이름</label>
                    <input type="text" name="customer_name" id="customerName" class="form-control form-control-lg"
                        maxlength="20" autocomplete="name" required aria-describedby="nameHelp">
                    <div id="nameHelp" class="invalid-feedback"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">전화번호</label>
                    <input type="tel" name="customer_phone" id="customerPhone" class="form-control form-control-lg"
                        inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="01012345678" required
                        aria-describedby="phoneHelp">
                    <div id="phoneHelp" class="invalid-feedback"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">소속 단체명</label>
                    <input type="text" name="organization" id="organization" class="form-control form-control-lg"
                        maxlength="20" placeholder="없을 경우 개인으로 입력해주세요." required
                        aria-describedby="organizationHelp">
                    <div id="organizationHelp" class="invalid-feedback"></div>
                </div>
                <button type="submit" id="submitButton" class="btn btn-primary btn-lg w-100" disabled>메뉴판 보기</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('customerLoginForm');
        const submitButton = document.getElementById('submitButton');
        const fields = {
            tableNo: document.getElementById('tableNo'),
            customerName: document.getElementById('customerName'),
            customerPhone: document.getElementById('customerPhone'),
            organization: document.getElementById('organization'),
        };
        const touchedFields = new Set();

        const rules = {
            tableNo(value) {
                if (!value) return { valid: false, message: '테이블 번호를 입력해주세요.' };
                const number = Number(value);
                if (!Number.isInteger(number) || number <= 0) {
                    return { valid: false, message: '1 이상의 숫자로 입력해주세요.' };
                }
                if (number > 2147483647) {
                    return { valid: false, message: '테이블 번호가 너무 큽니다.' };
                }
                return { valid: true, message: '' };
            },
            customerName(value) {
                if (!value) return { valid: false, message: '주문자 이름을 입력해주세요.' };
                if (value.length > 20) return { valid: false, message: '20자 이내로 입력해주세요.' };
                return { valid: true, message: '' };
            },
            customerPhone(value) {
                if (!value) return { valid: false, message: '전화번호를 입력해주세요.' };
                if (!/^\d{10,11}$/.test(value)) {
                    return { valid: false, message: '숫자 10자리 또는 11자리로 입력해주세요.' };
                }
                return { valid: true, message: '' };
            },
            organization(value) {
                if (!value) return { valid: false, message: '소속이 없으면 개인으로 입력해주세요.' };
                if (value.length > 20) return { valid: false, message: '20자 이내로 입력해주세요.' };
                return { valid: true, message: '' };
            },
        };

        function sanitizeNumeric(input) {
            const onlyDigits = input.value.replace(/\D/g, '');
            if (input.value !== onlyDigits) {
                input.value = onlyDigits;
            }
        }

        function setFieldState(key, result) {
            const input = fields[key];
            const message = document.getElementById(input.getAttribute('aria-describedby'));
            const shouldShowError = !result.valid && touchedFields.has(key);
            message.textContent = result.message;
            input.classList.toggle('is-invalid', shouldShowError);
        }

        function validateForm() {
            const results = {
                tableNo: rules.tableNo(fields.tableNo.value.trim()),
                customerName: rules.customerName(fields.customerName.value.trim()),
                customerPhone: rules.customerPhone(fields.customerPhone.value.trim()),
                organization: rules.organization(fields.organization.value.trim()),
            };

            Object.entries(results).forEach(([key, result]) => {
                setFieldState(key, result);
            });

            submitButton.disabled = !Object.values(results).every(result => result.valid);
        }

        [fields.tableNo, fields.customerPhone].forEach(input => {
            input.addEventListener('input', () => {
                touchedFields.add(input.id === 'tableNo' ? 'tableNo' : 'customerPhone');
                sanitizeNumeric(input);
                validateForm();
            });
        });

        fields.customerName.addEventListener('input', () => {
            touchedFields.add('customerName');
            validateForm();
        });

        fields.organization.addEventListener('input', () => {
            touchedFields.add('organization');
            validateForm();
        });

        form.addEventListener('submit', event => {
            Object.keys(fields).forEach(key => touchedFields.add(key));
            validateForm();
            if (submitButton.disabled) {
                event.preventDefault();
            }
        });

        validateForm();
    </script>
</body>

</html>
