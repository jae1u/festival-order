<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 시스템 접속</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="card shadow-sm mt-4">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">환영합니다! 👋</h3>
            <form action="/" method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted">테이블 번호</label>
                    <input type="number" name="table_no" class="form-control form-control-lg" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">주문자 이름</label>
                    <input type="text" name="customer_name" class="form-control form-control-lg" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">전화번호</label>
                    <input type="tel" name="customer_phone" class="form-control form-control-lg" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">소속 단체명</label>
                    <input type="text" name="organization" class="form-control form-control-lg" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">메뉴판 보기</button>
            </form>
        </div>
    </div>
</body>

</html>
