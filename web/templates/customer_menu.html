<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 주문</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-bottom: 112px;
            max-width: 600px;
            margin: auto;
        }

        .menu-row {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
        }

        .menu-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 12px;
        }

        .grayscale {
            filter: grayscale(100%);
        }

        .quantity-control {
            display: grid;
            grid-template-columns: 36px 36px 36px;
            align-items: center;
            gap: 4px;
        }

        .quantity-control .btn {
            width: 36px;
            height: 36px;
            line-height: 1;
            padding: 0;
        }

        .menu-qty {
            min-width: 36px;
            text-align: center;
            font-weight: 700;
        }

        .bottom-cart {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1000;
            max-width: 600px;
            margin: auto;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            background: #fff;
            border-top: 1px solid #dee2e6;
            box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.12);
        }

        .cart-badge {
            min-width: 28px;
        }

        .top-actions {
            display: flex;
            gap: 6px;
        }
    </style>
</head>

<body>
    <div class="bg-primary text-white p-3 sticky-top shadow-sm d-flex justify-content-between align-items-center">
        <h4 class="mb-0 text-center">Table {{ table_no }}</h4>
        <div class="top-actions">
            <a href="/my_orders" class="btn btn-sm btn-light fw-bold">주문 내역</a>
            <form action="{{ url_for('customer_logout') }}" method="POST"
                onsubmit="sessionStorage.removeItem('cart');">
                <button type="submit" class="btn btn-sm btn-outline-light fw-bold">로그아웃</button>
            </form>
        </div>
    </div>

    <div class="container mt-3">
        {% for menu in menus %}
        <div class="menu-row d-flex align-items-center mb-2 {{ 'opacity-50' if menu.is_soldout else '' }}">
            <img src="{{ menu.image_url }}" class="menu-img {{ 'grayscale' if menu.is_soldout else '' }}"
                alt="{{ menu.name }}">
            <div class="flex-grow-1">
                <h5 class="mb-1 fw-bold">
                    {{ menu.name }}
                    {% if menu.is_soldout %}
                    <span class="badge bg-danger ms-1">품절</span>
                    {% endif %}
                </h5>
                <p class="mb-0 text-muted">{{ "{:,}".format(menu.price) }}원</p>
            </div>

            <div class="quantity-control ms-2">
                <button type="button" class="btn btn-outline-secondary rounded-circle fw-bold" data-cart-action
                    data-name="{{ menu.name }}" data-price="{{ menu.price }}" data-delta="-1"
                    aria-label="{{ menu.name }} 빼기">-</button>
                <span class="menu-qty" data-name="{{ menu.name }}">0</span>
                <button type="button"
                    class="btn {{ 'btn-secondary' if menu.is_soldout else 'btn-outline-primary' }} rounded-circle fw-bold"
                    data-cart-action data-name="{{ menu.name }}" data-price="{{ menu.price }}" data-delta="1"
                    aria-label="{{ menu.name }} 추가" {% if menu.is_soldout %}disabled{% endif %}>+</button>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="bottom-cart">
        <div class="d-flex align-items-center justify-content-between gap-3">
            <div>
                <div class="small text-muted">장바구니</div>
                <div class="fw-bold"><span id="cartTotal">0</span>원</div>
            </div>
            <button class="btn btn-warning fw-bold flex-grow-1" onclick="showCart()">
                담은 메뉴 <span id="cartBadge" class="badge bg-danger rounded-pill cart-badge ms-1">0</span>개 확인
            </button>
        </div>
    </div>

    <!-- 장바구니 모달 -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">장바구니</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul id="cartList" class="list-group list-group-flush mb-3"></ul>
                    <h5 class="text-end fw-bold">총 <span id="modalCartTotal" class="text-danger">0</span>원</h5>
                </div>
                <div class="modal-footer">
                    <button type="button" id="orderButton" class="btn btn-primary w-100 btn-lg"
                        onclick="submitOrder()">주문하기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let cart = JSON.parse(sessionStorage.getItem('cart')) || {};
        const cartModal = new bootstrap.Modal(document.getElementById('cartModal'));
        const cartList = document.getElementById('cartList');
        const orderButton = document.getElementById('orderButton');

        document.querySelectorAll('[data-cart-action]').forEach(button => {
            button.addEventListener('click', () => {
                changeQuantity(button.dataset.name, Number(button.dataset.delta), Number(button.dataset.price));
            });
        });

        updateCartUI();

        function getTotalQuantity() {
            return Object.values(cart).reduce((sum, item) => sum + item.quantity, 0);
        }

        function getTotalPrice() {
            return Object.values(cart).reduce((sum, item) => sum + item.price * item.quantity, 0);
        }

        function saveCart() {
            sessionStorage.setItem('cart', JSON.stringify(cart));
        }

        function changeQuantity(name, delta, price) {
            const item = cart[name] || { price: price, quantity: 0 };
            item.quantity += delta;

            if (item.quantity <= 0) {
                delete cart[name];
            } else {
                cart[name] = item;
            }

            saveCart();
            updateCartUI();
            renderCartList();
        }

        function updateCartUI() {
            const totalQty = getTotalQuantity();
            const totalPrice = getTotalPrice();

            document.getElementById('cartBadge').innerText = totalQty;
            document.getElementById('cartTotal').innerText = totalPrice.toLocaleString();
            document.getElementById('modalCartTotal').innerText = totalPrice.toLocaleString();
            orderButton.disabled = totalQty === 0;

            document.querySelectorAll('.menu-qty').forEach(label => {
                label.innerText = cart[label.dataset.name]?.quantity || 0;
            });
        }

        function showCart() {
            renderCartList();
            cartModal.show();
        }

        function renderCartList() {
            cartList.innerHTML = '';

            if (Object.keys(cart).length === 0) {
                const emptyItem = document.createElement('li');
                emptyItem.className = 'list-group-item text-center text-muted';
                emptyItem.textContent = '장바구니가 비어있습니다.';
                cartList.appendChild(emptyItem);
                return;
            }

            Object.entries(cart).forEach(([name, item]) => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center gap-3';

                const info = document.createElement('div');
                const title = document.createElement('div');
                title.className = 'fw-semibold';
                title.textContent = name;
                const detail = document.createElement('small');
                detail.className = 'text-muted';
                detail.textContent = `${item.price.toLocaleString()}원 x ${item.quantity}`;
                info.append(title, detail);

                const controls = document.createElement('div');
                controls.className = 'btn-group';
                const minus = document.createElement('button');
                minus.type = 'button';
                minus.className = 'btn btn-outline-secondary';
                minus.textContent = '-';
                minus.addEventListener('click', () => changeQuantity(name, -1, item.price));
                const plus = document.createElement('button');
                plus.type = 'button';
                plus.className = 'btn btn-outline-primary';
                plus.textContent = '+';
                plus.addEventListener('click', () => changeQuantity(name, 1, item.price));
                controls.append(minus, plus);

                li.append(info, controls);
                cartList.appendChild(li);
            });
        }

        function submitOrder() {
            if (Object.keys(cart).length === 0) return alert('메뉴를 먼저 담아주세요.');
            const orderData = Object.keys(cart).map(name => ({ name: name, quantity: cart[name].quantity }));
            orderButton.disabled = true;

            fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cart: orderData })
            }).then(res => res.json()).then(data => {
                if (data.status === 'success') {
                    alert('주방으로 주문이 전달되었습니다!');
                    cart = {};
                    saveCart();
                    updateCartUI();
                    cartModal.hide();
                } else if (data.status === 'soldout') {
                    alert('🚨 죄송합니다. 다음 상품이 방금 품절되었습니다: \n- ' + data.soldout_items.join('\n- ') + '\n\n해당 상품은 장바구니에서 자동으로 삭제됩니다.');
                    data.soldout_items.forEach(item => { delete cart[item]; });
                    saveCart();
                    updateCartUI();
                    showCart();
                } else if (data.status === 'redirect') {
                    alert(data.message || '세션이 만료되었습니다. 다시 접속해주세요.');
                    window.location.href = data.url;
                } else {
                    alert(data.message || '주문 처리 중 문제가 발생했습니다.');
                }
            }).catch(() => {
                alert('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
            }).finally(() => {
                updateCartUI();
            });
        }
    </script>
</body>

</html>
