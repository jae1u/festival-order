<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 내역</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            max-width: 600px;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="bg-secondary text-white p-3 sticky-top d-flex align-items-center">
        <a href="/menu" class="text-white text-decoration-none fs-4 me-3">←</a>
        <h4 class="mb-0">Table {{ table_no }} 주문 내역</h4>
    </div>

    <div class="container mt-4">
        {% if not orders %}
        <div class="alert alert-light text-center">아직 주문한 메뉴가 없습니다.</div>
        {% else %}
        <ul class="list-group shadow-sm">
            {% for order in orders %}
            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                <div>
                    <h6 class="mb-1 fw-bold">{{ order.menu_name }}</h6>
                    <small class="text-muted">{{ order.order_time.strftime('%H:%M') }}</small>
                </div>
                <div class="text-end">
                    <span class="badge bg-dark rounded-pill fs-6 px-3 py-2">x{{ order.quantity }}</span>
                </div>
            </li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>
</body>

</html>
